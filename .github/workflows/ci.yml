name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: clearstack
          POSTGRES_PASSWORD: clearstack
          POSTGRES_DB: clearstack
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (optional)
        run: |
          pip install flake8 -q
          flake8 apps/ai_service --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Run unit and integration tests
        env:
          DATABASE_URL: postgresql://clearstack:clearstack@localhost:5432/clearstack
          REDIS_URL: redis://localhost:6379/0
          SERVICE_API_KEY: test-key-for-ci
        run: |
          pytest apps/ai_service/tests -v --tb=short --cov=apps/ai_service --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.12'
        with:
          files: ./.coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
